<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1220"><title>CAN 观测台</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--line:#26364c;--muted:#94a8c2;--cyan:#41d9e8;--green:#5ee0a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5ff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px 12px;background:#101a29;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px}main{padding:12px;max-width:850px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}button,.file{background:#1a2b40;color:#eaf6ff;border:1px solid #36516e;border-radius:10px;padding:11px 12px;font-size:14px;cursor:pointer}button.primary{background:#087f91;border-color:#1cbbcf}.file input{display:none}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #25354a}.stat:last-child{border:0}.muted{color:var(--muted);font-size:12px}input[type=range]{width:100%;accent-color:var(--cyan)}select,input[type=search]{background:#0d1725;color:white;border:1px solid #34485f;border-radius:9px;padding:10px}#signals{padding:5px 0}.group{border:1px solid #2e4258;border-radius:10px;margin:7px 0;overflow:hidden}.group summary{padding:11px;background:#0e1928;cursor:pointer}.sigrow{display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid #233449}.sigrow label{flex:1}.sigrow input{accent-color:#41d9e8}.value{font-size:27px;font-variant-numeric:tabular-nums;color:var(--green)}.plot{width:100%;height:200px;background:#0c1523;border-radius:10px;display:block}.plotbox{margin:10px 0;padding:9px;background:#0d1725;border-radius:11px}.plothead{display:flex;justify-content:space-between;margin-bottom:7px}.empty{padding:20px;color:#94a8c2;text-align:center}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}#readings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reading{background:#0d1725;padding:10px;border-radius:9px}.reading b{display:block;color:var(--cyan);font-size:18px;margin-top:4px}.seekrow{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}.notice{color:#f3cb79;font-size:12px;line-height:1.5}
</style><header><h1>CAN 观测台</h1><div class="sub">手机端报文回放 · 本地解析</div></header><main><section class="card"><div class="row"><label class="file">导入 ASC / BLF<input id="logfile" type="file" ></label><label class="file">导入 DBC<input id="dbcfile" type="file"  multiple></label></div><div id="summary" style="margin-top:10px"><div class="stat"><span>报文</span><span>尚未载入</span></div></div><div id="dbcinfo" class="muted" style="margin-top:6px">DBC 信号：尚未载入</div><p class="notice">支持 ASC 与 BLF 导入。多 DBC 按报文 ID 合并，同 ID 重复定义优先使用先载入文件。</p></section><section class="card"><div style="font-weight:600">信号库</div><input id="filter" type="search" placeholder="搜索信号或报文" style="width:100%;margin-top:8px"><div id="signals"></div></section><section class="card"><div class="row"><strong>观测页</strong><select id="mode"><option value="chart">曲线</option><option value="value">数值卡片</option></select></div><div id="timeControls" class="row" style="margin:8px 0"><span class="muted">横坐标时间窗</span><button id="zoomOut">−</button><select id="timeWindow"><option value="10">10 秒</option><option value="30">30 秒</option><option value="60" selected>1 分钟</option><option value="180">3 分钟</option><option value="600">10 分钟</option><option value="1380">23 分钟（全程）</option></select><button id="zoomIn">＋</button></div><div id="readings" style="margin:10px 0"></div><div id="plots"></div></section><section class="card"><div class="controls"><button id="back">−1 s</button><button id="play" class="primary">▶ 播放</button><button id="forward">+1 s</button></div><div class="row" style="margin-top:8px"><label class="muted">速度<select id="speed"><option>1</option><option>0.25</option><option>0.5</option><option>2</option><option>4</option></select>×</label><button id="step">下一帧</button><button id="home">回到开头</button></div><input id="seek" type="range" min="0" max="1000" value="0"><div class="seekrow"><span id="clock">00:00.000</span><span id="duration">/ 00:00.000</span></div><div id="frameinfo" class="muted"></div></section></main><script>
let msgs=[],defs=[],selected=[],pos=0,plotSpan=60,playing=false,lastTick=0,raf=0;const $=id=>document.getElementById(id);const fmt=s=>{s=Math.max(0,s);let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=(s%60).toFixed(3).padStart(6,'0');return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${x}`:`${String(m).padStart(2,'0')}:${x}`};
function parseDbc(t){let out=[],msg=null;for(let l of t.split(/\r?\n/)){let b=l.match(/^BO_\s+(\d+)\s+(\S+):\s+(\d+)/);if(b){msg={id:+b[1],name:b[2],dlc:+b[3]};continue}let s=l.match(/^\s*SG_\s+(\S+)\s*(?:m\d+\s*)?:\s*(\d+)\|(\d+)@(\d)([+-])\s*\(([^,]+),([^\)]+)\)\s*\[([^|]+)\|([^\]]+)\]\s*"([^"]*)"/);if(s&&msg)out.push({id:msg.id,msg:msg.name,name:s[1],start:+s[2],len:+s[3],little:s[4]==='1',signed:s[5]==='-',factor:+s[6],offset:+s[7],min:+s[8],max:+s[9],unit:s[10]})}for(let l of t.split(/\r?\n/)){let m=l.match(/^VAL_\s+(\d+)\s+(\S+)\s+(.+);/);if(!m)continue;let id=+m[1],name=m[2],map={};for(let v of m[3].matchAll(/(-?\d+)\s+"([^"]*)"/g))map[+v[1]]=v[2];let d=out.find(x=>x.id===id&&x.name===name);if(d)d.values=map}return out}
function decode(m,d){let raw=0n;if(d.little){for(let i=0;i<d.len;i++){let bit=d.start+i,byte=Math.floor(bit/8),shift=bit%8;if(byte>=m.data.length)return null;if((m.data[byte]>>shift)&1)raw|=1n<<BigInt(i)}}else{let bit=d.start;for(let i=0;i<d.len;i++){let byte=Math.floor(bit/8),shift=bit%8;if(byte>=m.data.length)return null;raw=(raw<<1n)|BigInt((m.data[byte]>>shift)&1);bit=(bit%8===0)?bit+15:bit-1}}if(d.signed&&(raw&(1n<<BigInt(d.len-1))))raw-=1n<<BigInt(d.len);return Number(raw)*d.factor+d.offset}
async function parseBlf(buf){const u=new Uint8Array(buf),v=new DataView(buf);if(String.fromCharCode(...u.slice(0,4))!=='LOGG')throw Error('BLF 文件头无效');const hdr=v.getUint32(4,true),base=new TextEncoder();let p=hdr,out=[];while(p+16<=u.length){if(String.fromCharCode(...u.slice(p,p+4))!=='LOBJ')throw Error('BLF 对象结构错误');let hs=v.getUint16(p+4,true),ver=v.getUint16(p+6,true),size=v.getUint32(p+8,true),type=v.getUint32(p+12,true);if(size<16||p+size>u.length)break;let d=p+hs,tm=0,flags=0;if(ver===1){flags=v.getUint32(d,true);tm=Number(v.getBigUint64(d+8,true))*(flags===1?1e-5:1e-9)}else if(ver===2){flags=v.getUint32(d,true);tm=Number(v.getBigUint64(d+16,true))*(flags===1?1e-5:1e-9)}else{p+=size+(size%4);continue}if(type===10){let method=v.getUint16(d+24,true),compressed=u.slice(d+32,p+size);let raw;if(method===0)raw=compressed;else if(method===2){if(!('DecompressionStream'in window))throw Error('此浏览器不支持 BLF 解压');let stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate'));raw=new Uint8Array(await new Response(stream).arrayBuffer())}else{p+=size+(size%4);continue}const rv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);let q=0;while(q+16<=raw.length){if(String.fromCharCode(...raw.slice(q,q+4))!=='LOBJ'){q++;continue}let oh=rv.getUint16(q+4,true),ov=rv.getUint16(q+6,true),os=rv.getUint32(q+8,true),ot=rv.getUint32(q+12,true),z=q+oh;if(os<16||q+os>raw.length)break;let fl=0,ts=0;if(ov===1){fl=rv.getUint32(z,true);ts=Number(rv.getBigUint64(z+8,true))*(fl===1?1e-5:1e-9)}else if(ov===2){fl=rv.getUint32(z,true);ts=Number(rv.getBigUint64(z+16,true))*(fl===1?1e-5:1e-9)}if(ot===1||ot===86){let ch=rv.getUint8(z+24),mf=rv.getUint8(z+25),dlc=rv.getUint8(z+26),id=rv.getUint32(z+28,true)&0x1fffffff,data=Array.from(raw.slice(z+40,z+40+Math.min(dlc,8)));if(data.length)out.push({t:ts,id,data,channel:ch})}q+=os+(os%4)}}p+=size+(size%4)}return out.sort((a,b)=>a.t-b.t)}
function parseAsc(t){let a=[];for(let l of t.split(/\r?\n/)){let m=l.trim().match(/^(\d+(?:\.\d+)?)\s+\d+\s+([0-9a-fA-F]+)\s+Rx\s+d\s+(\d+)\s*((?:[0-9a-fA-F]{2}\s*)+)/);if(!m)continue;let n=+m[3],bytes=m[4].trim().split(/\s+/).slice(0,n).map(x=>parseInt(x,16));if(bytes.length===n)a.push({t:+m[1],id:parseInt(m[2],16),data:bytes})}return a}
function render(){let q=$('filter').value.toLowerCase(),groups=new Map();for(let d of defs){if(!d.name.toLowerCase().includes(q)&&!d.msg.toLowerCase().includes(q)&&!String(d.id.toString(16)).includes(q))continue;let k=d.id.toString(16).toUpperCase();if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)}$('signals').innerHTML=[...groups].sort((a,b)=>parseInt(a[0],16)-parseInt(b[0],16)).map(([id,ds])=>`<details class="group"><summary>ID 0x${id} · ${ds[0].msg} · ${ds.length} 个信号</summary>${ds.map(d=>`<div class="sigrow"><input type="checkbox" data-name="${d.name}" ${selected.includes(d.name)?'checked':''}><label>${d.name}<span class="muted"> · ${d.unit||'无单位'} · ${d.len} bit</span></label></div>`).join('')}</details>`).join('')||'<div class="muted">先导入 DBC</div>';draw()}
function formatSignal(d,v){let num=Number.isInteger(v)?String(v):v.toFixed(2);let label=d.values&&d.values[Math.round(v)];return `${num} ${d.unit||''}${label!==undefined?' · '+label:''}`}
function valuesAt(t){let vals={};for(let d of defs){let found=null;for(let i=msgs.length-1;i>=0;i--){if(msgs[i].t>t)continue;if(msgs[i].id===d.id){found=decode(msgs[i],d);break}}if(found!==null)vals[d.name]=found}return vals}
function update(){if(!msgs.length)return;pos=Math.max(0,Math.min(msgs.at(-1).t-msgs[0].t,pos));let t=msgs[0].t+pos,vals=valuesAt(t);$('clock').textContent=fmt(pos);$('seek').value=Math.round(pos/(msgs.at(-1).t-msgs[0].t||1)*1000);$('frameinfo').textContent=`播放位置 ${fmt(t)} · ${msgs.filter(m=>m.t<=t).length.toLocaleString()} / ${msgs.length.toLocaleString()} 帧`;let items=selected.map(n=>defs.find(d=>d.name===n)).filter(Boolean);$('readings').style.display=$('mode').value==='value'?'grid':'none';$('timeControls').style.display=$('mode').value==='chart'?'flex':'none';$('readings').innerHTML=items.length?items.map(d=>`<div class="reading">${d.name}<b>${vals[d.name]===undefined?'等待报文':formatSignal(d,vals[d.name])}</b></div>`).join(''):'<div class="empty">先在信号库勾选要观测的信号</div>';draw()}
function draw(){let root=$('plots');let items=selected.map(name=>defs.find(d=>d.name===name)).filter(Boolean);if(!items.length){root.innerHTML='';return}root.innerHTML=items.map((d,i)=>`<div class="plotbox"><div class="plothead"><b>${d.name} <span class="liveval" data-live="${d.name}">—</span></b><span class="muted">${d.unit||''}</span></div><canvas class="plot" data-name="${d.name}"></canvas></div>`).join('');for(let c of root.querySelectorAll('canvas')){let d=defs.find(x=>x.name===c.dataset.name),ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.fillStyle='#0c1523';ctx.fillRect(0,0,w,h);let lo=Number.isFinite(d.min)?d.min:0,hi=Number.isFinite(d.max)&&d.max>lo?d.max:Math.pow(2,Math.min(d.len,16))*d.factor+d.offset;if(!Number.isFinite(hi)||hi<=lo){lo=0;hi=100}ctx.font='10px sans-serif';ctx.fillStyle='#91a7c2';ctx.strokeStyle='#26364c';for(let j=0;j<5;j++){let y=10+j*(h-20)/4,val=hi-(hi-lo)*j/4;ctx.beginPath();ctx.moveTo(52,y);ctx.lineTo(w-5,y);ctx.stroke();ctx.fillText(val.toFixed(hi-lo<10?2:0),2,y+3)}if(!msgs.length)continue;let span=Math.min(plotSpan,msgs.at(-1).t-msgs[0].t||plotSpan),begin=Math.max(0,Math.min(pos-span/2,(msgs.at(-1).t-msgs[0].t)-span)),end=begin+span;ctx.strokeStyle=['#41d9e8','#ffcc66','#bc8cff','#5ee0a0'][items.indexOf(d)%4];ctx.lineWidth=2;ctx.beginPath();let first=true;for(let m of msgs){let rel=m.t-msgs[0].t;if(rel<begin||rel>end||m.id!==d.id)continue;let val=decode(m,d);if(val===null)continue;let x=52+(rel-begin)/span*(w-57),y=h-10-(val-lo)/(hi-lo)*(h-20);if(first){ctx.moveTo(x,y);first=false}else ctx.lineTo(x,y)}ctx.stroke();let px=52+(pos-begin)/span*(w-57);ctx.strokeStyle='#fff';ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(px,6);ctx.lineTo(px,h-6);ctx.stroke();ctx.setLineDash([])}let vv=valuesAt(msgs[0].t+pos);for(let el of root.querySelectorAll('[data-live]')){let n=el.dataset.live,v=vv[n],dd=defs.find(x=>x.name===n);el.textContent=v===undefined?'—':formatSignal(dd,v)}}
function loaded(){if(!msgs.length)return;let dur=msgs.at(-1).t-msgs[0].t,gaps=[];for(let i=1;i<msgs.length;i++)if(msgs[i].t-msgs[i-1].t>30)gaps.push([msgs[i-1].t,msgs[i].t]);$('summary').innerHTML=`<div class="stat"><span>报文帧数</span><span>${msgs.length.toLocaleString()}</span></div><div class="stat"><span>记录时长</span><span>${fmt(dur)}</span></div><div class="stat"><span>大于 30 秒空档</span><span>${gaps.length}${gaps.length?` · ${gaps.map(g=>fmt(g[1]-g[0])).join('、')}`:''}</span></div>`;$('duration').textContent='/ '+fmt(dur);$('seek').max=1000;pos=0;update();render()}
$('dbcfile').onchange=async e=>{let files=[...e.target.files];defs=[];for(let f of files)defs.push(...parseDbc(await f.text()));$('dbcinfo').textContent=`DBC 信号：${defs.length} 个 · ${files.length} 个文件`;render()};$('logfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;msgs=f.name.toLowerCase().endsWith('.blf')?await parseBlf(await f.arrayBuffer()):parseAsc(await f.text());loaded()};
$('filter').oninput=render;$('signals').onchange=e=>{if(e.target.type==='checkbox'){let n=e.target.dataset.name;selected=e.target.checked?[...new Set([...selected,n])]:selected.filter(x=>x!==n);update()}};$('timeWindow').onchange=()=>{plotSpan=+$('timeWindow').value;draw()};$('zoomIn').onclick=()=>{plotSpan=Math.max(1,plotSpan/2);$('timeWindow').value=[...$('timeWindow').options].reduce((a,o)=>Math.abs(+o.value-plotSpan)<Math.abs(+a.value-plotSpan)?o:a,$('timeWindow').options[0]).value;plotSpan=+$('timeWindow').value;draw()};$('zoomOut').onclick=()=>{plotSpan=Math.min(1380,plotSpan*2);$('timeWindow').value=[...$('timeWindow').options].reduce((a,o)=>Math.abs(+o.value-plotSpan)<Math.abs(+a.value-plotSpan)?o:a,$('timeWindow').options[0]).value;plotSpan=+$('timeWindow').value;draw()};$('seek').oninput=()=>{pos=(msgs.at(-1).t-msgs[0].t)*(+$('seek').value/1000);update()};$('mode').onchange=()=>{$('plots').style.display=$('mode').value==='chart'?'block':'none';$('readings').style.display=$('mode').value==='value'?'grid':'none';$('timeControls').style.display=$('mode').value==='chart'?'flex':'none';draw()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'❚❚ 暂停':'▶ 播放';lastTick=performance.now();if(playing)raf=requestAnimationFrame(tick)};function tick(now){if(!playing)return;pos+=(now-lastTick)/1000*+$('speed').value;lastTick=now;if(pos>=msgs.at(-1).t-msgs[0].t){pos=msgs.at(-1).t-msgs[0].t;playing=false;$('play').textContent='▶ 播放'}update();raf=requestAnimationFrame(tick)}$('back').onclick=()=>{pos=Math.max(0,pos-1);update()};$('forward').onclick=()=>{pos=Math.min(msgs.at(-1).t-msgs[0].t,pos+1);update()};$('step').onclick=()=>{let t=msgs[0].t+pos,m=msgs.find(x=>x.t>t);if(m){pos=m.t-msgs[0].t;update()}};$('home').onclick=()=>{pos=0;update()};window.onresize=draw;
</script></html>
